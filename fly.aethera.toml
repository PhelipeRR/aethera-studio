app = 'aethera-studio'
primary_region = 'gru'

[build]

[env]
  NODE_ENV = 'production'
  AETHERA_DB_PATH = '/data/aethera-web.db'

[mounts]
  source = 'aethera_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
