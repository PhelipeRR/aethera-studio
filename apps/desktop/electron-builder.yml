# M1: the visible name is Singularity; the identity is not. `appId` (and the NSIS GUID derived from it) stays, so an
# upgrade finds the existing install, replaces it in place and leaves one entry in "Installed apps". The executable
# keeps its name too: the standalone Core's logon task, shortcuts and firewall rules point at NeuralBridge.exe.
appId: com.neuralbridge.desktop
productName: Singularity
executableName: NeuralBridge
artifactName: Singularity-Setup-${version}-${arch}.${ext}
directories:
  output: ../../dist
  buildResources: build
icon: build/icon.ico
files:
  - out/**/*
  - motion-bundle/**/*
  - motion/render-worker.mjs
  - package.json
  - build/icon.ico
  - '!**/onnxruntime-node/bin/napi-v6/linux/**'
  - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
asar: true
asarUnpack:
  - motion-bundle/**
  - motion/render-worker.mjs
  - node_modules/remotion/**
  - node_modules/@remotion/**
  # Everything the render worker imports: it runs outside app.asar and resolves nothing else.
  - node_modules/cross-spawn/**
  - node_modules/end-of-stream/**
  - node_modules/execa/**
  - node_modules/get-stream/**
  - node_modules/human-signals/**
  - node_modules/is-stream/**
  - node_modules/isexe/**
  - node_modules/merge-stream/**
  - node_modules/mimic-fn/**
  - node_modules/npm-run-path/**
  - node_modules/once/**
  - node_modules/onetime/**
  - node_modules/path-key/**
  - node_modules/pump/**
  - node_modules/react/**
  - node_modules/react-dom/**
  - node_modules/scheduler/**
  - node_modules/shebang-command/**
  - node_modules/shebang-regex/**
  - node_modules/signal-exit/**
  - node_modules/source-map/**
  - node_modules/strip-final-newline/**
  - node_modules/which/**
  - node_modules/wrappy/**
  - node_modules/ws/**
  - node_modules/better-sqlite3/**
  - node_modules/@modelcontextprotocol/sdk/**
  - node_modules/ajv/**
  - node_modules/ajv-formats/**
# Python cannot import from app.asar. Only the sources ship: the interpreter is provisioned apart, see src/main/local-worker.ts.
extraResources:
  - from: ../../packages/local-worker/src
    to: local-worker/src
    filter:
      - '**/*.py'
extraMetadata:
  main: out/main/index.js
win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Singularity
