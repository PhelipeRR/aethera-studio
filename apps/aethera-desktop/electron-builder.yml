appId: com.singularity.aethera
productName: Aethera Studio
executableName: AetheraStudio
artifactName: AetheraStudio-Setup-${version}-${arch}.${ext}
directories:
  output: ../../dist/aethera
  buildResources: build
icon: build/icon.ico
files:
  - out/**/*
  - package.json
  - build/icon.ico
  - '!**/onnxruntime-node/bin/napi-v6/linux/**'
  - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/remotion/**
  - node_modules/@remotion/**
  - node_modules/cross-spawn/**
  - node_modules/execa/**
  - node_modules/ws/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/semver/**
  - node_modules/color/**
  - node_modules/color-convert/**
  - node_modules/color-name/**
  - node_modules/detect-libc/**
extraResources:
  - from: ../../packages/database/migrations
    to: migrations
win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aethera Studio
