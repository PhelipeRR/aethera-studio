<h2 class="sr-only">Formulário de boas-vindas do robô MotionVelix para iniciar um projeto de vídeo</h2>
<div style="display:flex;align-items:center;gap:12px;padding:1rem 0 .75rem">
  <div style="width:40px;height:40px;border-radius:50%;background:var(--bg-tint-orange);color:var(--text-tint-orange);display:flex;align-items:center;justify-content:center"><i class="ti ti-robot" style="font-size:22px" aria-hidden="true"></i></div>
  <div><p style="margin:0;font-weight:500;font-size:15px">Velix · editor MotionVelix</p><p style="margin:0;font-size:13px;color:var(--text-secondary)">Me conta o que vamos fazer e eu cuido do resto. <span style="font-size:11px;color:var(--text-muted)">· v2.7.3</span></p></div>
</div>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Detalhes do projeto</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Vamos editar vídeos que você já gravou ou criar do zero?</label>
      <div class="elicit-pills" data-name="caminho" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Editar meus takes" style="border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left;min-width:200px;box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-movie" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px;font-weight:500">Editar meus takes</span><br><span style="font-size:11px;color:var(--text-muted)">Podcast, fala, aula, vlog</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Criar do zero" style="border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left;min-width:200px;box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-sparkles" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px;font-weight:500">Criar do zero</span><br><span style="font-size:11px;color:var(--text-muted)">Roteiro, voz, trilha e animação</span></span>
        </button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Que tipo de vídeo você quer no final?</label>
      <div class="elicit-pills" data-name="formato" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Reel com motion" style="width:118px;border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <svg width="48" height="36" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="17" y="2" width="14" height="32" rx="3"/><path d="M20 22h8M20 26h6"/><circle cx="24" cy="12" r="4"/></svg>
          <span style="font-size:13px;font-weight:500">Reel com motion</span>
        </button>
        <button type="button" class="elicit-pill" data-value="Legenda dinâmica" style="width:118px;border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <svg width="48" height="36" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="40" height="28" rx="3"/><rect x="12" y="20" width="10" height="6" rx="1"/><path d="M25 23h11"/></svg>
          <span style="font-size:13px;font-weight:500">Legenda dinâmica</span>
        </button>
        <button type="button" class="elicit-pill" data-value="Explicativo animado" style="width:118px;border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <svg width="48" height="36" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="18" r="7"/><rect x="24" y="8" width="18" height="6" rx="1"/><rect x="24" y="20" width="12" height="6" rx="1"/></svg>
          <span style="font-size:13px;font-weight:500">Explicativo animado</span>
        </button>
        <button type="button" class="elicit-pill" data-value="Anúncio" style="width:118px;border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <svg width="48" height="36" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 14v8l20 8V6z"/><path d="M28 12c6 0 10 2 10 6s-4 6-10 6"/></svg>
          <span style="font-size:13px;font-weight:500">Anúncio</span>
        </button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Onde estão seus arquivos (vídeos, músicas, imagens, logo)?</label>
      <div class="elicit-pills" data-name="arquivos" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Numa pasta do meu computador" style="border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left;min-width:200px;box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-folder" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px;font-weight:500">Numa pasta do computador</span><br><span style="font-size:11px;color:var(--text-muted)">Recomendado · qualquer tamanho</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Vou anexar aqui no chat" style="border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left;min-width:200px;box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-paperclip" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px;font-weight:500">Anexar aqui no chat</span><br><span style="font-size:11px;color:var(--text-muted)">Arquivos pequenos</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Não tenho arquivos" style="border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left;min-width:200px;box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-wand" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px;font-weight:500">Não tenho arquivos</span><br><span style="font-size:11px;color:var(--text-muted)">O Velix cria tudo do zero</span></span>
        </button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Se forem pequenos, anexe aqui. E me conta a ideia:</label>
      <div class="elicit-files" data-name="anexos">
        <label class="elicit-dropzone">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M16.5 13a.5.5 0 0 1 .5.5v2a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5v-2a.5.5 0 0 1 1 0v2a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 1 .5-.5M10 3a.5.5 0 0 1 .374.168l4 4.5.059.082a.5.5 0 0 1-.732.65l-.075-.068L10.5 4.814V13.5a.5.5 0 0 1-1 0V4.814L6.374 8.332a.5.5 0 0 1-.748-.664l4-4.5.08-.071A.5.5 0 0 1 10 3"/></svg>
          <span>Escolher vídeo, música ou imagem</span>
          <input type="file" multiple accept="video/*,audio/*,image/*">
        </label>
      </div>
      <textarea class="elicit-textarea" data-name="ideia_text" placeholder="Ex.: reel de 60s com a letra da minha música aparecendo no ritmo, do começo até o refrão"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual vibe combina com seu público?</label>
      <div class="elicit-pills" data-name="vibe" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Viral e enérgico">Viral e enérgico</button>
        <button type="button" class="elicit-pill" data-value="Premium e limpo">Premium e limpo</button>
        <button type="button" class="elicit-pill" data-value="Fofo / infantil">Fofo / infantil</button>
        <button type="button" class="elicit-pill" data-value="Me surpreenda">Me surpreenda</button>
        <button type="button" class="elicit-pill" data-value="Outra" data-other>Outra</button>
      </div>
      <input type="text" class="elicit-other" data-for="vibe" placeholder="Descreve o estilo que você imagina">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Quanto tempo de vídeo final?</label>
      <input type="range" data-name="duracao_segundos" min="15" max="90" step="15" value="45">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)"><span>15 s · rápido</span><span>90 s · completo</span></div>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Pular</button>
    <button type="button" class="elicit-submit">Começar projeto</button>
  </div>
</form>
