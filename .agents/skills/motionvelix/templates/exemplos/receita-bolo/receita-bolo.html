<!doctype html>
<html><head><meta charset="utf-8">
<!-- MotionVelix · "Bolo de caneca em 3 minutos" — receita em motion do zero (narração + trilha 112 BPM + SFX no beat) -->
<link rel="stylesheet" href="../../../engine/mv.css">
<script src="../../../engine/mv.js"></script>
<style>
  :root{--cream:#FFF1E4;--choco:#4A2A1A;--choco2:#7A4A2E;--pink:#FF8FB1;--pinkL:#FFD3E0;--yel:#FFC93C;--mint:#7ED7C1;--ink:#2B1A12}
  html,body{background:var(--cream)}
  #stage{position:absolute;inset:0;overflow:hidden}
  #bg{position:absolute;inset:0}
  #dots{position:absolute;inset:-60px;background-image:radial-gradient(rgba(74,42,26,.08) 3px,transparent 3.5px);background-size:64px 64px}
  .abs{position:absolute}
  .ctr{left:0;right:0;text-align:center}
  .fr{font-family:Fredoka;font-weight:700;line-height:.95;letter-spacing:-.01em}
  .stroke{paint-order:stroke fill;-webkit-text-stroke:14px #fff}
  img.obj{position:absolute;filter:drop-shadow(0 22px 26px rgba(74,42,26,.22))}
  .chip{position:absolute;padding:12px 28px;border-radius:999px;font:700 44px Fredoka;white-space:nowrap;box-shadow:0 10px 0 rgba(74,42,26,.15)}
  .row{position:absolute;left:90px;right:90px;height:96px;display:flex;align-items:center;gap:22px;font:600 52px Fredoka;color:var(--ink)}
  .row .ck{width:64px;height:64px;border-radius:50%;border:6px solid var(--choco2);display:flex;align-items:center;justify-content:center;flex:none}
  .row .ck svg{width:40px;height:40px}
  .row .q{font:700 58px Fredoka;color:var(--pink);min-width:84px;text-align:right;-webkit-text-stroke:0}
  .row b{font-weight:700}
  .part{position:absolute;border-radius:50%}
  .scn{position:absolute;inset:0;display:none}
</style></head>
<body>
<div id="stage"><div id="bg"></div><div id="dots"></div></div>
<script>
const S = document.getElementById('stage'), E = MV.E, clamp = MV.clamp, lerp = MV.lerp, R = MV.rand(11);
const DUR = 36.6;
const BEATS = [0.65, 1.207, 1.718, 2.276, 2.81, 3.344, 3.878, 4.435, 4.946, 5.503, 6.014, 6.548, 7.082, 7.639, 8.173, 8.731, 9.242, 9.776, 10.31, 10.867, 11.378, 11.935, 12.469, 13.003, 13.537, 14.071, 14.605, 15.163, 15.673, 16.231, 16.765, 17.322, 17.833, 18.367, 18.901, 19.458, 19.969, 20.526, 21.06, 21.595, 22.129, 22.663, 23.197, 23.754, 24.265, 24.822, 25.356, 25.89, 26.424, 26.958, 27.492, 28.05, 28.561, 29.118, 29.652, 30.186, 30.72, 31.277, 31.788, 32.345, 32.856, 33.414, 33.948, 34.482, 35.016, 35.573, 36.084, 36.641, 37.152, 37.709, 38.243, 38.777, 39.311, 39.869];
const snap = (t, tol = .16) => { let best = t, d = 9; for (const b of BEATS) { for (const x of [b, b + .267]) { const dd = Math.abs(x - t); if (dd < d) { d = dd; best = x; } } } return d < tol ? best : t; };
const H = (html, p = S) => { const t = document.createElement('template'); t.innerHTML = html.trim(); const el = t.content.firstElementChild; p.appendChild(el); return el; };
const pos = (el, x, y, w) => { el.style.left = x + 'px'; el.style.top = y + 'px'; if (w) el.style.width = w + 'px'; return el; };
const img = (src, x, y, w, p) => pos(H(`<img class="obj" src="a/${src}.webp">`, p), x, y, w);
const win = (el, a, b, disp = 'block') => MV.fn(-1, 1e9, (lt, p, g) => { el.style.display = (g >= a && g < b) ? disp : 'none'; });
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')})`; };

// ---------- fundo que muda de cor por capítulo ----------
const BGK = [[0, '#FFF1E4'], [17.2, '#FFF1E4'], [17.6, '#FFE1EA'], [21.2, '#FFE1EA'], [21.6, '#DDF4EC'], [26.6, '#DDF4EC'], [27.0, '#FFF1E4'], [30.7, '#FFF1E4'], [31.1, '#FFE6BF']];
const bg = document.getElementById('bg'), dots = document.getElementById('dots');
MV.fn(-1, 1e9, (lt, p, g) => { let i = 0; while (i < BGK.length - 1 && BGK[i + 1][0] <= g) i++; const [t0, c0] = BGK[i], [t1, c1] = BGK[Math.min(i + 1, BGK.length - 1)]; bg.style.background = t1 > t0 ? mix(c0, c1, E.inOutCubic(clamp((g - t0) / (t1 - t0)))) : c0; dots.style.transform = `translateY(${-g * 14 % 64}px)`; });

// ---------- partículas (respingos/pó) ----------
function burst(t, x, y, { cor = '#fff', n = 14, tam = [14, 30], forca = 700, grav = 1500, blur = 0, sfx = null, up = true, pai = null } = {}) {
  for (let i = 0; i < n; i++) {
    const s = tam[0] + R() * (tam[1] - tam[0]), ang = up ? -Math.PI / 2 + (R() - .5) * 2.2 : R() * 6.283, v = forca * (.4 + R() * .7), dl = R() * .05;
    const el = H(`<div class="part" style="width:${s}px;height:${s}px;background:${[].concat(cor)[i % [].concat(cor).length]};${blur ? `filter:blur(${blur}px)` : ''}"></div>`, pai || PL);
    pos(el, x - s / 2, y - s / 2);
    MV.fn(-1, 1e9, (lt, p, g) => { const tt = g - t - dl; if (tt < 0 || tt > 1) { el.style.display = 'none'; return; } el.style.display = 'block';
      el.style.transform = `translate(${Math.cos(ang) * v * tt}px,${Math.sin(ang) * v * tt + grav * tt * tt}px) scale(${1 - tt * .6})`; el.style.opacity = 1 - clamp((tt - .6) / .4); });
  }
  if (sfx) MV.sfx(sfx, t, .45);
}

// =====================================================================================
// CENA A · GANCHO + MONTAGEM (0 → 17.4) — a caneca cai e fica; ingredientes voam pra dentro
// =====================================================================================
const A = H(`<div class="scn"></div>`); win(A, 0, 17.45);
const MUGX = 300, MUGY = 1200, MUGW = 480, RIMX = 300 + 480 * .39, RIMY = 1222;
const shadow = H(`<div class="abs" style="left:270px;top:1615px;width:480px;height:66px;border-radius:50%;background:radial-gradient(closest-side,rgba(74,42,26,.25),transparent)"></div>`, A);
// caderno (fica ATRÁS de tudo)
const nb = H(`<div class="abs" style="left:60px;right:60px;top:110px;height:790px;background:#fff;border-radius:48px;box-shadow:0 18px 0 rgba(74,42,26,.08),0 30px 60px rgba(74,42,26,.12)"></div>`, A);
const nbt = H(`<div class="abs ctr fr" style="top:140px;font-size:60px;color:var(--choco2)">📝 RECEITA · 7 ingredientes</div>`, A);
MV.to(nb, { from: { y: 1900, rot: 6, opacity: 0 }, to: { y: 0, rot: 0, opacity: 1 }, at: 4.25, dur: .55, ease: 'outBack' });
MV.to(nbt, { from: { y: 1900, opacity: 0 }, to: { y: 0, opacity: 1 }, at: 4.25, dur: .55, ease: 'outBack' }); MV.sfx('papel', 4.3, .5);
const lines = [...Array(7)].map((_, i) => H(`<div class="abs" style="left:120px;right:120px;top:${236 + i * 88 + 80}px;height:3px;background:#F3E1D3;border-radius:3px;transform-origin:0 50%"></div>`, A));
MV.to(lines, { from: { sx: 0 }, to: { sx: 1 }, at: 4.6, dur: .4, ease: 'outCubic', stagger: .04 });
const CK = `<svg viewBox="0 0 40 40"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ITENS = [
  { q: 1, txt: '<b>ovo</b>', img: 'ovo_ok', tipo: 'cai', w: 210, ar: 723 / 656, row: 6.32, word: 6.57, part: { cor: ['#FFC93C', '#FFB000', '#FFF6D8'], n: 14, tam: [16, 30] }, snd: 'drop' },
  { q: 4, txt: 'colheres de <b>leite</b>', img: 'leite_ok', tipo: 'despeja', liq: '#FFFFFF', w: 150, ar: 1005 / 505, row: 7.77, word: 8.65, part: { cor: ['#FFFFFF', '#F5F1EA'], n: 16, tam: [12, 24] }, snd: 'drop' },
  { q: 3, txt: 'colheres de <b>óleo</b>', img: 'oleo_ok', tipo: 'despeja', liq: '#F7C948', w: 150, ar: 1004 / 505, row: 9.61, word: 10.09, part: { cor: ['#F7C948', '#FFD966'], n: 12, tam: [10, 20] }, snd: 'drop' },
  { q: 4, txt: 'colheres de <b>açúcar</b>', img: 'acucar_ok', tipo: 'colher', po: '#FFFFFF', w: 400, ar: 422 / 997, row: 10.89, word: 11.37, part: { cor: ['#FFFFFF', '#EEE'], n: 20, tam: [6, 12] }, snd: 'brilho' },
  { q: 4, txt: 'colheres de <b>farinha</b>', img: 'farinha_ok', tipo: 'colher', po: '#FFFFFF', w: 400, ar: 389 / 987, row: 12.41, word: 12.89, part: { cor: ['rgba(255,255,255,.95)'], n: 12, tam: [40, 90], blur: 8, forca: 380 }, snd: 'papel_pop' },
  { q: 2, txt: 'de <b>chocolate em pó</b>', img: 'cacau_ok', tipo: 'colher', po: '#6B3F26', w: 400, ar: 406 / 981, row: 13.77, word: 14.25, part: { cor: ['rgba(92,52,30,.85)', 'rgba(122,74,46,.8)'], n: 12, tam: [40, 90], blur: 8, forca: 380 }, snd: 'papel_pop' },
  { q: 1, txt: 'colher (chá) de <b>fermento</b>', img: 'farinha_ok', tipo: 'colher', po: '#FFFFFF', w: 280, ar: 389 / 987, row: 15.41, word: 16.49, part: { cor: ['#FFFFFF'], n: 14, tam: [6, 12] }, snd: 'brilho' },
];
const ROWS = ITENS.map((it, i) => H(`<div class="row" style="top:${236 + i * 88}px;height:84px;font-size:46px"><div class="ck" style="width:56px;height:56px">${CK}</div><span class="q" style="font-size:52px">0</span><span>${it.txt}</span></div>`, A));
const ING = H(`<div class="abs" style="inset:0"></div>`, A);       // ingredientes (atrás da caneca, na frente do caderno)
const mug = img('caneca_ok', MUGX, MUGY, MUGW, A);
const PL = H(`<div class="abs" style="inset:0"></div>`, A);        // partículas (na frente)
// gancho
const t1 = H(`<div class="abs ctr fr stroke" style="top:190px;font-size:150px;color:var(--ink)">BOLO DE</div>`, A);
const t2 = H(`<div class="abs ctr fr stroke" style="top:350px;font-size:168px;color:var(--choco2)">CHOCOLATE</div>`, A);
const drip = H(`<svg class="abs" style="left:110px;top:505px" width="860" height="120" viewBox="0 0 860 120"><path d="M0 0 H860 V18 C 830 18 828 70 806 70 C 784 70 786 22 760 22 C 735 22 735 100 705 100 C 676 100 680 26 650 26 C 600 26 610 58 585 58 C 560 58 560 24 520 24 C 480 24 485 86 455 86 C 425 86 430 22 380 22 C 340 22 345 64 318 64 C 292 64 296 24 250 24 C 210 24 215 108 182 108 C 150 108 156 26 110 26 C 70 26 76 54 52 54 C 28 54 30 18 0 18 Z" fill="#7A4A2E"/></svg>`, A);
const t3 = H(`<div class="abs ctr" style="top:660px"><span class="chip" style="position:relative;display:inline-block;background:var(--yel);color:var(--ink);font-size:84px;padding:14px 46px">⏱ 3 MIN</span></div>`, A);
const t4 = H(`<div class="abs ctr fr stroke" style="top:820px;font-size:120px;color:var(--pink)">na caneca!</div>`, A);
MV.to(t1, { from: { scale: 2.2, opacity: 0, blur: 8 }, to: { scale: 1, opacity: 1, blur: 0 }, at: -.15, dur: .4, ease: 'outExpo' }); MV.sfx('pop', .05, .4);
MV.to(t2, { from: { scale: 2.2, opacity: 0, blur: 8 }, to: { scale: 1, opacity: 1, blur: 0 }, at: .62, dur: .4, ease: 'outExpo' }); MV.sfx('pop', snap(.7), .45);
MV.to(drip, { from: { sy: 0 }, to: { sy: 1 }, at: .95, dur: .9, ease: 'outBack' }); drip.style.transformOrigin = '50% 0';
MV.to(t3, { from: { scale: 0, rot: -12 }, to: { scale: 1, rot: 0 }, at: 1.62, dur: .5, ease: 'outBack' }); MV.sfx('tic', snap(1.7), .5);
MV.fx.punch(t3.firstElementChild, 2.25, { s: 1.1, sfx: false });
MV.to(t4, { from: { y: 60, opacity: 0, rot: -6 }, to: { y: 0, opacity: 1, rot: -3 }, at: 2.75, dur: .45, ease: 'outBack' });
const MUGLAND = snap(3.0);
MV.to(mug, { from: { y: -2300, rot: -14 }, to: { y: 0, rot: 0 }, at: MUGLAND - .45, dur: .45, ease: 'inQuad' });
MV.to(mug, { from: {}, to: { sy: .82, sx: 1.12 }, at: MUGLAND, dur: .07, ease: 'outQuad' }); MV.to(mug, { from: {}, to: { sy: 1, sx: 1 }, at: MUGLAND + .07, dur: .45, ease: 'outElastic' });
mug.style.transformOrigin = '50% 100%';
MV.to(shadow, { from: { scale: .2, opacity: 0 }, to: { scale: 1, opacity: 1 }, at: MUGLAND - .35, dur: .4, ease: 'inQuad' });
MV.sfx('tap', MUGLAND, .7); burst(MUGLAND, 540, 1640, { cor: ['#FFC93C', '#FF8FB1', '#7ED7C1'], n: 12, tam: [12, 22], forca: 600 });
MV.to([t1, t2, drip, t3, t4], { from: {}, to: { y: -900, opacity: 0 }, at: 4.05, dur: .45, ease: 'inBack', stagger: .03 }); MV.sfx('deslize', 4.05, .35);
// fio caindo (líquido ou pó) do ponto (x,y0) até a boca da caneca
function fio(a, b, x, y0, cor, larg = 18, po = false) {
  const el = H(`<div class="abs" style="left:${x - larg / 2}px;top:${y0}px;width:${larg}px;height:${RIMY + 12 - y0}px;border-radius:${larg}px;background:${cor};transform-origin:50% 0;${po ? 'filter:blur(3px);opacity:.9' : 'box-shadow:0 0 0 2px rgba(0,0,0,.04)'}"></div>`, ING);
  MV.fn(-1, 1e9, (lt, p, g) => { if (g < a || g > b + .2) { el.style.display = 'none'; return; } el.style.display = 'block';
    const i = clamp((g - a) / .12), o = clamp((g - b) / .2); el.style.transform = `scaleY(${i})`; el.style.clipPath = `inset(${o * 100}% 0 0 0)`; });
}
ITENS.forEach((it, i) => {
  const row = ROWS[i], ck = row.querySelector('.ck'), q = row.querySelector('.q');
  MV.to(row, { from: { x: -120, opacity: 0 }, to: { x: 0, opacity: 1 }, at: it.row, dur: .4, ease: 'outBack' });
  const land = snap(it.word + .35);           // momento em que cai na caneca (no beat)
  const W = it.w, Hh = W * it.ar, side = i % 2 ? -1 : 1;
  const el = img(it.img, 0, 0, W, ING);
  if (it.tipo === 'cai') {                     // ovo: entra pela lateral, para em cima e cai pra dentro
    pos(el, RIMX - W / 2, RIMY - Hh - 40);
    MV.to(el, { from: { x: 760 * side, y: -220, rot: 40 * side, opacity: 1 }, to: { x: 0, y: 0, rot: -8 * side }, at: land - .8, dur: .42, ease: 'outBack' });
    MV.to(el, { from: {}, to: { y: Hh + 200, rot: 25 * side, scale: .85 }, at: land - .22, dur: .24, ease: 'inQuad' });
    MV.to(el, { from: {}, to: { opacity: 0 }, at: land + .1, dur: .01 });
    MV.sfx('tac', land - .25, .4);
  } else if (it.tipo === 'despeja') {          // garrafa: entra, inclina e despeja um fio
    const wrap = H(`<div class="abs" style="left:${RIMX + 26 - W / 2}px;top:${RIMY - 230}px;width:${W}px;height:${Hh}px;transform-origin:50% 0"></div>`, ING);
    el.remove(); wrap.appendChild(el); pos(el, 0, 0, W);
    MV.to(wrap, { from: { x: 760, y: -140, rot: 0, opacity: 1 }, to: { x: 0, y: 0, rot: 0 }, at: land - .95, dur: .4, ease: 'outBack' });
    MV.to(wrap, { from: {}, to: { rot: -128 }, at: land - .55, dur: .3, ease: 'inOutCubic' });
    fio(land - .3, land + .32, RIMX + 26, RIMY - 228, it.liq, 20);
    MV.to(wrap, { from: {}, to: { rot: -30, x: 800, y: -250 }, at: land + .38, dur: .42, ease: 'inBack' });
    MV.sfx('deslize', land - .55, .3);
  } else {                                     // colher: entra, vira e o pó cai
    pos(el, RIMX - W * .22, RIMY - Hh - 190); el.style.transformOrigin = '22% 60%';
    MV.to(el, { from: { x: 760, y: -160, rot: 20, opacity: 1 }, to: { x: 0, y: 0, rot: 0 }, at: land - .85, dur: .4, ease: 'outBack' });
    MV.to(el, { from: {}, to: { rot: -62 }, at: land - .38, dur: .22, ease: 'inOutCubic' });
    fio(land - .2, land + .18, RIMX, RIMY - 175, it.po, 26, true);
    MV.to(el, { from: {}, to: { rot: -20, x: 820, y: -200 }, at: land + .3, dur: .4, ease: 'inBack' });
    MV.sfx('deslize', land - .4, .25);
  }
  // impacto na caneca + respingos/pó
  MV.to(mug, { from: {}, to: { sy: .9, sx: 1.06 }, at: land, dur: .06, ease: 'outQuad' }); MV.to(mug, { from: {}, to: { sy: 1, sx: 1 }, at: land + .06, dur: .35, ease: 'outElastic' });
  burst(land + .02, RIMX, RIMY + 8, { ...it.part, sfx: it.snd });
  // check + contador no ritmo (colcheias)
  MV.to(ck, { from: { scale: 1 }, to: { scale: 1.25 }, at: land, dur: .1 }); MV.to(ck, { from: {}, to: { scale: 1 }, at: land + .1, dur: .3, ease: 'outBack' });
  MV.fn(-1, 1e9, (lt, p, g) => { const on = g >= land; ck.style.background = on ? 'var(--choco2)' : 'transparent'; ck.querySelector('svg').style.opacity = on ? 1 : 0;
    const k = g < land ? 0 : Math.min(it.q, 1 + Math.floor((g - land) / .267)); q.textContent = k ? (k + '') : ''; });
  for (let k = 0; k < it.q; k++) { MV.sfx(k ? 'tic' : 'pop', land + k * .267, k ? .5 : .4); MV.fx.punch(q, land + k * .267, { s: 1.35, sfx: false }); }
});
// a caneca "dança" no beat enquanto monta
MV.fn(4.5, 17.3, (lt, p, g) => { let k = 0; for (const b of BEATS) if (b <= g) k = Math.exp(-(g - b) * 10); shadow.style.opacity = .9 + .1 * k; });

// =====================================================================================
// CENA B · MEXER (17.4 → 21.35) — vista de cima, redemoinho satisfatório
// =====================================================================================
const B = H(`<div class="scn"></div>`); win(B, 17.3, 21.8);
MV.fn(17.3, 17.75, (lt, p) => { B.style.clipPath = `circle(${E.inOutQuart(clamp(lt / .45)) * 1500}px at ${RIMX}px ${RIMY}px)`; });
MV.fn(17.75, 30, () => { B.style.clipPath = 'none'; });
MV.sfx('deslize', 17.3, .4);
const ring = H(`<div class="abs" style="left:190px;top:620px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE3EC,#FF9DBB 60%,#F27CA1);box-shadow:0 40px 60px rgba(74,42,26,.18)"></div>`, B);
const handle = H(`<div class="abs" style="left:840px;top:880px;width:170px;height:180px;border:44px solid #F58DAE;border-left:none;border-radius:0 90px 90px 0"></div>`, B);
const bowl = H(`<div class="abs" style="left:250px;top:680px;width:580px;height:580px;border-radius:50%;overflow:hidden;box-shadow:inset 0 14px 30px rgba(0,0,0,.35)"></div>`, B);
const sw = H(`<div class="abs" style="inset:-30%;background:conic-gradient(from 0deg,#C99A6A,#5A3220,#C99A6A,#5A3220,#C99A6A,#5A3220,#C99A6A)"></div>`, bowl);
const sw2 = H(`<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 50%,#E9C79F 0 8%,transparent 40%)"></div>`, bowl);
const smooth = H(`<div class="abs" style="inset:0;background:radial-gradient(circle at 38% 32%,#8A5636,#4E2A18 55%,#3B1F12)"></div>`, bowl);
const gloss = H(`<div class="abs" style="left:110px;top:80px;width:220px;height:90px;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(10px);rotate:-25deg"></div>`, bowl);
const spoon = H(`<svg class="abs" style="left:250px;top:680px;overflow:visible" width="580" height="580" viewBox="0 0 580 580"><g id="sp"><rect x="285" y="-260" width="34" height="420" rx="17" fill="#D9D9DE"/><ellipse cx="302" cy="190" rx="58" ry="78" fill="#C7C7CF"/><ellipse cx="292" cy="178" rx="20" ry="34" fill="rgba(255,255,255,.6)"/></g></svg>`, B);
const spg = spoon.querySelector('#sp');
MV.fn(17.4, 21.35, (lt, p, g) => {
  const mixP = clamp((g - 18.0) / 2.3), ang = E.inOutCubic(clamp((g - 17.5) / 3.6)) * 1440;
  sw.style.transform = `rotate(${ang * .9}deg) scale(${1 + .2 * Math.sin(g * 3)})`; sw.style.filter = `blur(${2 + mixP * 18}px)`;
  smooth.style.opacity = E.inOutCubic(mixP); gloss.style.opacity = .4 + .6 * mixP; sw2.style.transform = `rotate(${-ang}deg)`;
  spg.setAttribute('transform', `rotate(${ang} 290 290) translate(0 ${-30 + 20 * Math.sin(g * 6)})`);
});
MV.to([ring, handle, bowl, spoon], { from: { scale: 1.6, opacity: 0 }, to: { scale: 1, opacity: 1 }, at: 17.3, dur: .5, ease: 'outCubic' });
const mx1 = H(`<div class="abs ctr fr stroke" style="top:240px;font-size:170px;color:var(--choco2)">MEXE</div>`, B);
const mx2 = H(`<div class="abs ctr fr stroke" style="top:410px;font-size:130px;color:var(--pink)">mexe!</div>`, B);
MV.to(mx1, { from: { scale: 0, rot: -10 }, to: { scale: 1, rot: -4 }, at: snap(17.93) - .05, dur: .4, ease: 'outBack' }); MV.sfx('deslize', snap(17.93), .4);
