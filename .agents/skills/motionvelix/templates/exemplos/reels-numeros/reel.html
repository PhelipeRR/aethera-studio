<!doctype html>
<html><head><meta charset="utf-8">

<style>

  .cap .w.on{background:var(--yel);color:var(--ink);text-shadow:none}
  body.light .cap{color:var(--ink);text-shadow:none}
  body.light .cap .w.hl{color:var(--red)}
  body.light .cap .w.on{background:var(--ink);color:var(--yel)}
  .hook{position:absolute;left:70px;right:140px;top:1020px;text-align:center;z-index:40}

  .hook .b{display:inline;background:#fff;color:var(--ink);font:900 62px/1.3 Inter;letter-spacing:-.03em;padding:4px 18px;border-radius:14px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

  /* celular (tempo de uso) */
  .ph{position:absolute;left:255px;top:430px;width:570px;height:1000px;border-radius:70px;background:#1C1C1F;padding:18px;box-shadow:0 0 0 3px #333,0 50px 100px rgba(0,0,0,.6)}

  .ph .isl{position:absolute;top:22px;left:50%;width:150px;height:40px;margin-left:-75px;border-radius:22px;background:#111}
  .ph .t1{font:800 54px Inter;letter-spacing:-.02em}
  .ph .t2{font:600 26px Inter;color:#8E8E93;margin-top:30px}
  .ph .big{font:800 96px Inter;letter-spacing:-.04em;margin-top:4px}

  .bars i{flex:1;border-radius:10px 10px 4px 4px;background:#0A84FF;transform-origin:50% 100%}
  .bars i.over{background:var(--red2)}
  .lim{position:absolute;left:30px;right:30px;border-top:5px dashed var(--red2)}
  .lim span{position:absolute;right:0;top:-46px;font:800 28px Inter;color:var(--red2)}
  .days{position:absolute;left:40px;right:40px;top:784px;display:flex;justify-content:space-between;font:600 24px Inter;color:#8E8E93}
  .bill{position:absolute;width:150px;height:76px;border-radius:10px;background:linear-gradient(135deg,#7DDC8A,#3DAA57);border:4px solid #CFF5D4;display:grid;place-items:center;font:900 34px Inter;color:#145C2A}
  .barW{position:absolute;left:90px;right:90px;top:900px;height:150px;border-radius:30px;background:#1B1B1F;overflow:visible}
  .seg{position:absolute;top:0;bottom:0;border-radius:30px;display:grid;place-items:center;font:900 46px Inter;color:#0B2414}
  .hg{position:absolute;left:390px;top:260px;width:300px;height:420px}
</style></head>
<body class="alpha"><div id="stage"></div>
<script>
const S = document.getElementById('stage'), E = MV.E, clamp = MV.clamp, R = MV.rand(5);

    if (g < a || g >= b) { el.style.display = 'none'; return; } el.style.display = 'block';
    let cp = 'none'; const pi = clamp((g - a) / .4), po = clamp((g - (b - .32)) / .32);
    if (pi < 1) { const q = E.inOutQuart(pi); cp = inn === 'circle' ? `circle(${q * 2300}px at ${ox}px ${oy}px)` : inn === 'up' ? `inset(${(1 - q) * 100}% 0 0 0 round ${(1 - q) * 80}px ${(1 - q) * 80}px 0 0)` : `inset(0 0 0 ${(1 - q) * 100}%)`; }
    if (po > 0 && out === 'up') { const q = E.inOutQuart(po); cp = `inset(0 0 ${q * 100}% 0 round 0 0 ${q * 90}px ${q * 90}px)`; }
    el.style.clipPath = cp;
  });
  return el;
}
const slam = (el, at, s0 = 2.2) => { MV.to(el, { from: { scale: s0, opacity: 0, blur: 10 }, to: { scale: 1, opacity: 1, blur: 0 }, at, dur: .35, ease: 'outExpo' }); MV.sfx('tap', at + .02, .45); };

const count = (el, a, b, at, dur, fmt) => MV.fn(-1, 1e9, (lt, p, g) => { const q = E.outExpo(clamp((g - at) / dur)); el.textContent = fmt(a + (b - a) * q); });
const brl = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');

// ===== STICKER no vídeo (22 → 24.9)

// ===== M4 · 3h POR DIA = R$ 1.687/MÊS (24.9 → 33.2) vermelho
{ const s = scene(24.9, 33.7, 'var(--red)', { ox: 540, oy: 700 });

}

{ const s = scene(33.2, 40.95, '#0B0B0D', { inn: 'up' });

    .map(([t, a, x, yy, rt]) => { const c = H(`<div class="chip" style="left:${x}px;top:${yy}px;background:#fff;color:var(--ink);rotate:${rt}deg">${t}</div>`, s); pop(c, a); return c; });

// ===== LEGENDAS
const KW = new Set(['celular', 'celular,', 'celular.', 'problema', '3', 'mil', '160', '18,75', '18,75:', '90', '1.687', 'distração.', '20', '20%', '100', 'reels,', 'tiktok', 'whatsapp.', 'pior?', 'percebe.', 'tempo', 'volta.', 'dinheiro']);
MV.fn(-1, 1e9, (lt, p, g) => document.body.classList.toggle('light', LIGHT.some(([a, b]) => g >= a && g < b)));
const SCN = [[4.6, 10.42], [15, 22], [24.9, 33.7], [33.2, 40.95], [43.12, 99]];
window.MV_READY = MV.loadJSON('palavras.json').then(j => {
  const W = j.words, ch = []; let cur = [];
