<!doctype html>
<html><head><meta charset="utf-8">
<!-- TEMPLATE: AETHERA CINEMA OVERLAY (MotionVelix --alpha para 16:9 e 9:16)
     Renderizado pelo Chromium (engine/render.mjs --alpha) com legendas karaokê, badges por cena com wipe e SFX. -->
<link rel="stylesheet" href="../engine/mv.css">
<script src="../engine/mv.js"></script>
<style>
  body { background: transparent; margin: 0; overflow: hidden; }
  .cap {
    position: absolute;
    left: var(--padX, 64px);
    right: var(--padX, 64px);
    bottom: var(--capBottom, 44px);
    text-align: center;
    line-height: 1.15;
    pointer-events: none;
  }
  .cap .w { display: inline-block; margin: 0 .14em; transition: none; }
  .s-destaque {
    font-family: Inter, sans-serif;
    font-weight: 900;
    font-size: var(--capSize, 42px);
    letter-spacing: -.02em;
    color: #fff;
    text-shadow: 0 4px 16px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.95);
  }
  .s-destaque .w.on { color: var(--ac); }
  .s-destaque .w.hl { color: var(--ac); }
  .s-caixa {
    font-family: Inter, sans-serif;
    font-weight: 800;
    font-size: var(--capSize, 40px);
    color: #fff;
    text-shadow: 0 3px 12px rgba(0,0,0,.8);
  }
  .s-caixa .w.on {
    background: var(--ac);
    color: var(--acink, #fff);
    border-radius: 10px;
    padding: 2px .22em;
    text-shadow: none;
  }
  .scene-badge {
    position: absolute;
    left: var(--padX, 48px);
    top: var(--badgeTop, 36px);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  .scene-badge b {
    display: inline-block;
    padding: 8px 18px;
    background: rgba(12, 10, 24, 0.82);
    border-left: 5px solid var(--ac);
    color: #fff;
    font-family: Inter, sans-serif;
    font-weight: 800;
    font-size: var(--badgeTitleSize, 26px);
    letter-spacing: -.01em;
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45);
  }
  .scene-badge span {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(0,0,0,.68);
    color: #e2e8f0;
    font-family: Mono, monospace;
    font-weight: 600;
    font-size: var(--badgeSubSize, 15px);
    border-radius: 6px;
    letter-spacing: .04em;
  }
  .head {
    position: absolute;
    left: var(--padX, 64px);
    right: var(--padX, 64px);
    top: var(--headTop, 110px);
    text-align: center;
  }
  .head .kicker {
    color: #fff;
    opacity: .9;
    font-family: Inter, sans-serif;
    font-weight: 700;
    font-size: var(--kickerSize, 24px);
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,.75);
  }
  .head .t {
    font-family: Inter, sans-serif;
    font-weight: 900;
    font-size: var(--headSize, 58px);
    line-height: 1.02;
    letter-spacing: -.03em;
    color: #fff;
    text-shadow: 0 8px 26px rgba(0,0,0,.65);
    text-transform: uppercase;
  }
  .hud {
    position: absolute;
    top: var(--hudTop, 18px);
    right: var(--padX, 48px);
    font-family: Mono, monospace;
    font-weight: 700;
    font-size: var(--hudSize, 15px);
    letter-spacing: .12em;
    color: #fff;
    opacity: .8;
    text-shadow: 0 2px 8px rgba(0,0,0,.75);
  }
  .prog {
    position: absolute;
    top: 0;
    left: 0;
    height: 5px;
    background: var(--ac);
    box-shadow: 0 0 12px var(--ac);
  }
</style></head>
<body class="t-roxo-neon alpha">
<div id="stage"></div>
<script>
const D = window.MV_DATA || { w: 1280, h: 720, dur: 6, fps: 30, words: [] };
const W = D.w || 1280;
const H = D.h || 720;
const isPortrait = H > W;
const scale = isPortrait ? W / 1080 : W / 1280;

document.body.className = (D.theme || 't-roxo-neon') + ' alpha';
if (D.ac) { document.documentElement.style.setProperty('--ac', D.ac); document.body.style.setProperty('--ac', D.ac); }
if (D.acInk) document.body.style.setProperty('--acink', D.acInk);

const rootStyle = document.documentElement.style;
rootStyle.setProperty('--padX', Math.round((isPortrait ? 72 : 56) * scale) + 'px');
rootStyle.setProperty('--capBottom', Math.round((isPortrait ? 260 : 42) * scale) + 'px');
rootStyle.setProperty('--capSize', Math.round((isPortrait ? 64 : 40) * scale) + 'px');
rootStyle.setProperty('--badgeTop', Math.round((isPortrait ? 140 : 32) * scale) + 'px');
rootStyle.setProperty('--badgeTitleSize', Math.round((isPortrait ? 38 : 25) * scale) + 'px');
rootStyle.setProperty('--badgeSubSize', Math.round((isPortrait ? 22 : 14) * scale) + 'px');
rootStyle.setProperty('--headTop', Math.round((isPortrait ? 260 : 120) * scale) + 'px');
rootStyle.setProperty('--headSize', Math.round((isPortrait ? 88 : 54) * scale) + 'px');
rootStyle.setProperty('--kickerSize', Math.round((isPortrait ? 32 : 22) * scale) + 'px');
rootStyle.setProperty('--hudTop', Math.round(20 * scale) + 'px');
rootStyle.setProperty('--hudSize', Math.round(14 * scale) + 'px');

const S = document.getElementById('stage');
S.style.width = W + 'px';
S.style.height = H + 'px';
const fps = D.fps || 30;
const DUR = D.dur || Math.max(1, ...(D.words || [{ e: 5 }]).map(w => w.e)) + .5;
const KW = new Set((D.keywords || []).map(k => k.toLowerCase().replace(/[^\p{L}\p{N}%]/gu, '')));
const norm = w => String(w || '').toLowerCase().replace(/[^\p{L}\p{N}%]/gu, '');

// Animated word-by-word karaoke captions
const style = D.style || 'destaque';
const maxW = D.maxWords || (isPortrait ? 4 : 6);
const chunks = [];
let cur = [];
(D.words || []).forEach((w, i, a) => {
  cur.push(w);
  const next = a[i + 1];
  const pause = next ? next.s - w.e : 9;
  if (cur.length >= maxW || pause > .35 || /[.!?,;:]$/.test(w.w)) { chunks.push(cur); cur = []; }
});
if (cur.length) chunks.push(cur);

chunks.forEach((c, ci) => {
  const el = document.createElement('div');
  el.className = `cap s-${style}`;
  el.innerHTML = c.map(w => `<span class="w${KW.has(norm(w.w)) ? ' hl' : ''}">${w.w}</span>`).join(' ');
  S.appendChild(el);
  const a = Math.max(0, c[0].s - .04);
  const b = Math.min(chunks[ci + 1] ? chunks[ci + 1][0].s - .045 : c[c.length - 1].e + .45, c[c.length - 1].e + .6);
  MV.to(el, { from: { opacity: 0, y: 18, scale: .94 }, to: { opacity: 1, y: 0, scale: 1 }, at: a, dur: .14, ease: 'outBack' });
  MV.to(el, { from: {}, to: { opacity: 0 }, at: b, dur: .001, ease: 'linear' });
  const spans = el.querySelectorAll('.w');
  c.forEach((w, wi) => MV.fn(-1, 1e9, (lt, p, g) => {
    spans[wi].classList.toggle('on', g >= w.s - .03 && g < (c[wi + 1] ? c[wi + 1].s : b));
  }));
  c.forEach((w, wi) => {
    MV.to(spans[wi], { from: { scale: 1 }, to: { scale: 1.07 }, at: w.s - .03, dur: .07, ease: 'outQuad' });
    MV.to(spans[wi], { from: {}, to: { scale: 1 }, at: w.s + .07, dur: .18, ease: 'outCubic' });
  });
});

// Animated per-scene lower/top badges with subtle wipe + blip SFX
(D.lowers || []).forEach(l => {
  const el = document.createElement('div');
  el.className = 'scene-badge';
  el.innerHTML = `<b>${l.nome}</b>` + (l.cargo ? `<span>${l.cargo}</span>` : '');
  S.appendChild(el);
  MV.fx.wipeR(el.querySelector('b'), l.at, { dur: .32, sfx: l.sfx || false });
  if (l.cargo) MV.fx.wipeR(el.querySelector('span'), l.at + .12, { dur: .3, sfx: false });
  MV.fx.out(el, l.at + (l.dur || 3), { dur: .24, y: -12 });
});

// Opening/closing headline
(D.heads || []).forEach(h => {
  const el = document.createElement('div');
  el.className = 'head';
  el.innerHTML = (h.kicker ? `<div class="kicker">${h.kicker}</div>` : '') + `<div class="t">${h.text}</div>`;
  S.appendChild(el);
  const at = Math.max(0, h.at);
  const ws = MV.words(el.querySelector('.t'), { mask: true });
  MV.fx.maskUp(ws, at, { stagger: .05 });
  MV.sfx(h.sfx || 'deslize', at, .4);
  if (h.kicker) MV.fx.rise(el.querySelector('.kicker'), at, { y: 14 });
  MV.fx.out(el, h.at + h.dur, { dur: .25, y: -16 });
});

// Timecode HUD
if (D.hud) {
  const el = document.createElement('div');
  el.className = 'hud';
  el.innerHTML = `<span>${D.hud.left || 'AETHERA'} <span class="tc"></span></span>`;
  S.appendChild(el);
  const tc = el.querySelector('.tc');
  MV.fn(-1, 1e9, (lt, p, g) => {
    const f = Math.max(0, g);
    tc.textContent = `${String(Math.floor(f / 60)).padStart(2, '0')}:${String(Math.floor(f % 60)).padStart(2, '0')}`;
  });
}

if (D.progress) {
  const p = document.createElement('div');
  p.className = 'prog';
  S.appendChild(p);
  MV.to(p, { from: { width: 0 }, to: { width: W }, at: 0, dur: DUR, ease: 'linear' });
}

MV.setup({ w: W, h: H, fps, dur: DUR });
</script></body></html>
